<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Explore Sunay Storage by topic, search research questions, and compare feasibility and impact.">
  <meta name="theme-color" content="#ffffff">
  <title>Idea navigator · Sunay Joshi</title>
  <link rel="icon" href="/images/favicon.ico?v=upenn">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261111d">
  <link rel="stylesheet" href="pareto.css?v=20261111d">
  <script type="module" src="app.js?v=20261111d"></script>
</head>
<body>
  <a class="skip-link" href="#explore">Skip to ideas</a>
  <main>
    <header>
      <nav class="header-links" aria-label="Page links"><a class="home-link" href="/">← Sunay Joshi</a><a class="source-link" href="https://www.overleaf.com/project/679049496c769f29fefd3f44" target="_blank" rel="noopener noreferrer">Open document ↗</a></nav>
      <div class="title-row"><h1>Idea navigator</h1></div>
    </header>
    <section class="controls" aria-label="Search and filter ideas">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
        <label for="search" class="sr-only">Search ideas</label>
        <input type="search" id="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-describedby="search-status">
        <button id="clear" type="button" hidden aria-label="Clear search">×</button>
      </div>
      <label for="topic" class="sr-only">Topic collection</label><select id="topic"><option value="all">All topics</option></select>
    </section>
    <div class="search-guidance"><p id="search-status" class="sr-only" role="status">Search by meaning, words, or an idea ID.</p><button class="text-button" id="reset-filters" type="button" hidden>Reset filters</button></div>
    <section id="explore" tabindex="-1">
      <div class="view-bar">
        <div class="view-tabs" role="tablist" aria-label="Explore ideas">
          <button id="tab-bubbles" type="button" role="tab" data-view="bubbles" aria-controls="bubbles-panel" aria-selected="true">Topic bubbles</button>
          <button id="tab-list" type="button" role="tab" data-view="list" aria-controls="list-panel" aria-selected="false" tabindex="-1">List</button>
          <button id="tab-pareto" type="button" role="tab" data-view="pareto" aria-controls="pareto-panel" aria-selected="false" tabindex="-1">Feasibility × impact</button>
        </div>
        <label class="pareto-filter"><input type="checkbox" id="pareto-only"> Pareto only</label>
      </div>
      <div class="navigation-line"><nav id="breadcrumbs" aria-label="Topic path"></nav><p id="count" class="sr-only" role="status" aria-live="polite">Loading ideas…</p></div>
      <section id="bubbles-panel" role="tabpanel" aria-labelledby="tab-bubbles"><div id="bubbles-chart"></div></section>
      <section id="pareto-panel" role="tabpanel" aria-labelledby="tab-pareto" hidden><div id="pareto-chart"></div></section>
      <section id="list-panel" role="tabpanel" aria-labelledby="tab-list" hidden>
        <div class="list-toolbar"><label for="sort">Sort by</label><select id="sort"><option value="relevance">Relevance</option><option value="document">Document order</option><option value="feasibility">Feasibility: high to low</option><option value="impact">Impact: high to low</option><option value="product">Impact × feasibility: high to low</option></select></div>
        <div class="column-labels" aria-hidden="true"><span>IDEA</span><span>FEASIBILITY</span><span>IMPACT</span></div>
        <section id="ideas" aria-label="Research ideas"></section>
      </section>
      <div id="empty" hidden><h2>No matching ideas</h2><p>Try a broader question or clear the topic filter.</p><button id="reset" type="button">Reset search and filters</button></div>
    </section>
    <details class="rubric"><summary>About the scores</summary><div id="rubric-body"></div></details>
    <noscript><p>This navigator needs JavaScript for search and visualizations. <a href="https://www.overleaf.com/project/679049496c769f29fefd3f44">Read the original document.</a></p></noscript>
  </main>
  <dialog id="idea-dialog" aria-labelledby="dialog-title"><div class="dialog-toolbar"><span id="dialog-id"></span><a id="visibility-control" target="_blank" rel="noopener noreferrer" aria-label="Hide or show this idea (opens private settings)">Hide / show</a><button id="copy-link" type="button">Copy link</button><button id="close-dialog" type="button" aria-label="Close idea">Close ×</button></div><h2 id="dialog-title"></h2><div id="dialog-scores"></div><div id="dialog-body"></div></dialog>
</body>
</html>
